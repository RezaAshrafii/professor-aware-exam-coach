[project]
name = "professor-aware-exam-coach"
version = "0.7.2"
description = "Local-first professor-aware university exam preparation coach"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
