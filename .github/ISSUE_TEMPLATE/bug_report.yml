name: Bug report
description: گزارش یک رفتار قابل بازتولید
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: مشکل
      description: چه اتفاقی افتاد؟
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: مراحل بازتولید
      placeholder: |
        1. برنامه را اجرا کردم
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: رفتار مورد انتظار
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: نسخه
      placeholder: v0.4.0
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: لاگ یا اسکرین‌شات
